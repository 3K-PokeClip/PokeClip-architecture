name: Sync main to xodbs1021 repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push-to-upstream:
    # 이 파일이 xodbs1021 저장소로 함께 복사돼도 거기서는 실행되지 않도록 조직 저장소에서만 동작
    if: github.repository == '3K-PokeClip/PokeClip-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # checkout이 저장하는 기본 자격증명(github-actions[bot])이 SYNC_TOKEN을 덮어쓰지 않도록
          persist-credentials: false

      - name: Push main to xodbs1021/PokeClip-architecture
        # --force 가 필요하다. 이건 미러이지 갈래가 아니다 — 조직이 항상 이긴다.
        # 2026-08-16 계약4·9가 미러에 직접 발행되면서 미러가 2커밋 앞서버렸고,
        # 그 뒤로 이 push 가 non-fast-forward 로 거부돼 미러가 얼어붙었다.
        # 미러에 직접 쓴 것은 다음 동기화에 사라진다. 쓰려면 조직 저장소에 써라.
        run: git push --force https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/xodbs1021/PokeClip-architecture.git HEAD:main
